name: Companion
options:
  bundleIdPrefix: com.clubmate
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SDKROOT: iphoneos
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CompanionKit:
    path: CompanionKit

targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: Companion
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Companion
        PRODUCT_MODULE_NAME: Companion
        PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.companion
        INFOPLIST_FILE: Companion/Info.plist
        MARKETING_VERSION: "0.0.0-dev"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: CompanionKit
