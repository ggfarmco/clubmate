name: Companion
options:
  bundleIdPrefix: com.clubmate
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SDKROOT: iphoneos
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CompanionKit:
    path: CompanionKit
  ClubmateDocument:
    path: ClubmateDocument

targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - path: Companion
        excludes:
          - "Info.plist"
      - path: Clubmate/SDUI/GalleryFixture.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Companion
        PRODUCT_MODULE_NAME: Companion
        PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.companion
        INFOPLIST_FILE: Companion/Info.plist
        CODE_SIGN_ENTITLEMENTS: Companion/Companion.entitlements
        MARKETING_VERSION: "0.0.0-dev"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: CompanionKit
      - package: ClubmateDocument
    scheme:
      testTargets:
        - CompanionTests
        - CompanionUITests

  CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CompanionTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.companion.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Companion.app/Companion"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Companion

  CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CompanionUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Companion
    dependencies:
      - target: Companion

  CompanionE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CompanionE2ETests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.companion.e2etests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Companion
    dependencies:
      - target: Companion

schemes:
  CompanionE2E:
    build:
      targets:
        Companion: all
        CompanionE2ETests: [test]
    test:
      config: Debug
      targets:
        - CompanionE2ETests
