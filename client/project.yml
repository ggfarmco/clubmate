name: Clubmate
options:
  bundleIdPrefix: com.clubmate
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CLANG_CXX_LIBRARY: "libc++"
  configs:
    Debug:
      ENABLE_DEBUG_DYLIB: NO

packages:
  ClubmateKit:
    path: ClubmateKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"

targets:
  Clubmate:
    type: application
    platform: macOS
    sources:
      - path: Clubmate
        excludes:
          - "Info.plist"
          - "Clubmate-dev.entitlements"
          - "Resources/ghostty"
          - "Resources/terminfo"
      - path: Clubmate/Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Clubmate/Resources/terminfo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Clubmate
        PRODUCT_MODULE_NAME: Clubmate
        INFOPLIST_FILE: Clubmate/Info.plist
        MARKETING_VERSION: "0.0.0-dev"
        CURRENT_PROJECT_VERSION: "1"
        CLUBMATE_COMMIT: ""
        SPARKLE_PUBLIC_KEY: ""
        OTHER_LDFLAGS:
          - "-lc++"
        OTHER_SWIFT_FLAGS:
          - "-Xcc"
          - "-Wno-incomplete-umbrella"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.app.dev
          PRODUCT_NAME: Clubmate Dev
          CLUBMATE_FLAVOR: dev
          CODE_SIGN_ENTITLEMENTS: Clubmate/Clubmate-dev.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.clubmate.app
          CLUBMATE_FLAVOR: release
    postBuildScripts:
      - name: Bundle Go binaries
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../scripts/bundle-app.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - package: ClubmateKit
      - package: Sparkle
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOKit.framework
      - sdk: CoreText.framework
