name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  go:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: go-go-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-go-${{ hashFiles('go.mod', 'go.sum') }}-
            go-go-
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod

      - name: Go tests
        run: go test -race ./...

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: go-go-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod

  kit:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: go-kit-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-kit-${{ hashFiles('go.mod', 'go.sum') }}-
            go-kit-
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod

      - name: ClubmateKit tests
        run: make kit-test

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: go-kit-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod

  app:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: go-app-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-app-${{ hashFiles('go.mod', 'go.sum') }}-
            go-app-
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen

      - name: GhosttyKit cache key
        id: ghostty
        run: |
          rev="$(sed -n 's/^GHOSTTY_REV="\(.*\)"$/\1/p' scripts/build-ghostty.sh)"
          zig="$(sed -n 's/^ZIG_FORMULA="\(.*\)"$/\1/p' scripts/build-ghostty.sh)"
          echo "key=ghosttykit-$rev-$zig" >>"$GITHUB_OUTPUT"

      - name: Restore GhosttyKit
        id: ghostty-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.ghostty.outputs.key }}
          path: |
            client/GhosttyKit.xcframework
            client/Clubmate/Resources/ghostty
            client/Clubmate/Resources/terminfo
            .ghostty-build-stamp

      - name: Install zig
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: brew install zig@0.16

      - name: Install Metal toolchain
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build GhosttyKit
        run: make ghostty

      - name: Save GhosttyKit
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.ghostty.outputs.key }}
          path: |
            client/GhosttyKit.xcframework
            client/Clubmate/Resources/ghostty
            client/Clubmate/Resources/terminfo
            .ghostty-build-stamp

      - name: Vendor cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: vendor-${{ hashFiles('scripts/tools.lock', 'scripts/nvim-distro.lock', 'scripts/nvim-distro/parsers.lua') }}
          restore-keys: vendor-
          path: build/vendor

      - name: Build app
        run: make app

      - name: Nvim distro tests
        run: make nvim-test

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: go-app-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
