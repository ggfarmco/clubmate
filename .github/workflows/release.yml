name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: xcode-27
    environment: release
    timeout-minutes: 120
    steps:
      - name: Check secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 SPARKLE_PRIVATE_KEY SPARKLE_PUBLIC_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z[-suffix]"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >>"$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Install zig and XcodeGen
        run: brew install zig@0.16 xcodegen

      - name: GhosttyKit cache key
        id: ghostty
        run: |
          rev="$(sed -n 's/^GHOSTTY_REV="\(.*\)"$/\1/p' scripts/build-ghostty.sh)"
          zig="$("$(brew --prefix zig@0.16)/bin/zig" version)"
          echo "key=ghosttykit-$rev-zig$zig" >>"$GITHUB_OUTPUT"

      - name: Restore GhosttyKit
        id: ghostty-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.ghostty.outputs.key }}
          path: |
            client/GhosttyKit.xcframework
            client/Clubmate/Resources/ghostty
            client/Clubmate/Resources/terminfo
            .ghostty-build-stamp

      - name: Install Metal toolchain
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/build.sh "$VERSION"

      - name: Import Developer ID certificate
        id: identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode >"$p12"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "::error::no Developer ID Application identity in the p12"
            exit 1
          fi
          echo "sha1=$identity" >>"$GITHUB_OUTPUT"

      - name: Sign app
        env:
          IDENTITY: ${{ steps.identity.outputs.sha1 }}
        run: scripts/release/sign.sh dist/Clubmate.app "$IDENTITY"

      - name: Build DMG
        env:
          IDENTITY: ${{ steps.identity.outputs.sha1 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/dmg.sh dist/Clubmate.app "$VERSION" "$IDENTITY"

      - name: Delete keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/notarize.sh "dist/Clubmate-$VERSION.dmg"

      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: scripts/release/appcast.sh "dist/Clubmate-$VERSION.dmg" "$VERSION" "$BUILD"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release/notes.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "dist/Clubmate-$VERSION.dmg" dist/appcast.xml \
            --title "Clubmate $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
