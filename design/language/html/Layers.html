<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Icon Composer layers</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/cm.css">

<style>
body{margin:0}
a{color:#2f8a45}a:hover{color:#11482a}
</style>

</head><body>

<div style="width: 1560px; height: 440px; box-sizing: border-box; padding: 48px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 32px; background: #f7f7f8; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif; color: #1c1c1e">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 264px; height: 264px; border-radius: 16px; overflow: hidden; background: repeating-conic-gradient(#e2e2e6 0% 25%, #ffffff 0% 50%) 0 0 / 24px 24px"><img src="assets/layer-1-background.png" alt="Layer 1: background" style="width: 264px; height: 264px; display: block"></div>
<figcaption style="font-size: 14px; color: #55555b">1 · background</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 264px; height: 264px; border-radius: 16px; overflow: hidden; background: repeating-conic-gradient(#e2e2e6 0% 25%, #ffffff 0% 50%) 0 0 / 24px 24px"><img src="assets/layer-2-gourd.png" alt="Layer 2: calabash with rim and yerba" style="width: 264px; height: 264px; display: block"></div>
<figcaption style="font-size: 14px; color: #55555b">2 · calabash, rim, yerba</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 264px; height: 264px; border-radius: 16px; overflow: hidden; background: repeating-conic-gradient(#e2e2e6 0% 25%, #ffffff 0% 50%) 0 0 / 24px 24px"><img src="assets/layer-3-bombilla.png" alt="Layer 3: bombilla" style="width: 264px; height: 264px; display: block"></div>
<figcaption style="font-size: 14px; color: #55555b">3 · bombilla</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 264px; height: 264px; border-radius: 16px; overflow: hidden; background: repeating-conic-gradient(#e2e2e6 0% 25%, #ffffff 0% 50%) 0 0 / 24px 24px"><img src="assets/layer-4-glyph.png" alt="Layer 4: burned prompt glyph" style="width: 264px; height: 264px; display: block"></div>
<figcaption style="font-size: 14px; color: #55555b">4 · &gt;_ burn</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="width: 264px; height: 264px; border-radius: 60px; overflow: hidden; position: relative">
<img src="assets/layer-1-background.png" alt="" style="position: absolute; inset: 0; width: 264px; height: 264px">
<img src="assets/layer-2-gourd.png" alt="" style="position: absolute; inset: 0; width: 264px; height: 264px">
<img src="assets/layer-3-bombilla.png" alt="" style="position: absolute; inset: 0; width: 264px; height: 264px">
<img src="assets/layer-4-glyph.png" alt="All four layers stacked" style="position: absolute; inset: 0; width: 264px; height: 264px">
</div>
<figcaption style="font-size: 14px; color: #55555b">stacked, masked</figcaption>
</figure>
</div>
</body></html>
