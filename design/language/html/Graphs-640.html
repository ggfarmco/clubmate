<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Graph run, 640</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/cm.css">
<link rel="stylesheet" href="assets/c.css">


<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>

</head><body>

<div class="cm th-latte" style="width: 640px; height: 800px; overflow: hidden">
<div class="win">

<header class="tb">
<div class="lights"><i style="background: #FF5F57"></i><i style="background: #FEBC2E"></i><i style="background: #28C840"></i></div>
<button class="pill" style="flex: 0 1 auto; min-width: 0"><span class="ell">design-brief</span><span class="faint">/</span><span class="ell">docs/design-brief</span><svg class="i s12 mut" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg></button>
<span style="flex: 1"></span>
<button class="pill" aria-label="Notifications: 3 need you"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11Z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg><span class="count">3</span></button>
</header>

<div class="body" style="grid-template-columns: 40px minmax(0, 1fr)">
<nav class="rail" aria-label="Sections">
<button class="ri" aria-label="Code ⌘1"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4 2 8l3.5 4M10.5 4 14 8l-3.5 4"/></svg></button>
<button class="ri" aria-label="Terminals ⌘2"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="m4.5 6 2 2-2 2M8.5 10.5h3"/></svg></button>
<button class="ri" aria-label="Agents ⌘3, 3 need you"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 9.3 6.7 14.5 8 9.3 9.3 8 14.5 6.7 9.3 1.5 8 6.7 6.7Z"/></svg><span class="bdg"></span></button>
<button class="ri" aria-label="Backlog ⌘4"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><path d="m1.8 4 1.2 1.2L5 3M7.5 4h7M7.5 8.5h7M7.5 13h7"/><circle cx="3.3" cy="8.5" r="1.3"/><circle cx="3.3" cy="13" r="1.3"/></svg></button>
<button class="ri" aria-label="Processes ⌘5"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6.5 1.5v2.5M9.5 1.5v2.5M6.5 12v2.5M9.5 12v2.5M1.5 6.5H4M1.5 9.5H4M12 6.5h2.5M12 9.5h2.5"/></svg></button>
<button class="ri" aria-label="Cron ⌘6"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg></button>
<button class="ri" aria-label="Triggers ⌘7"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8Z"/></svg></button>
<button class="ri on" aria-label="Graphs ⌘8"><svg class="i s16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="4" r="1.8"/><circle cx="12.5" cy="4" r="1.8"/><circle cx="8" cy="12" r="1.8"/><path d="M5.3 4h5.4M4.4 5.6l2.7 4.8M11.6 5.6l-2.7 4.8"/></svg></button>
</nav>

<main class="main">
<div style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-bottom: 1px solid var(--bd); background: var(--s1); flex: none">
<button class="btn sm gh"><svg class="i s12" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>Graphs</button>
<span class="faint">/</span>
<span class="mut cap">run · 31 min</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 14px; border-bottom: 1px solid var(--bd); flex: none">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 class="h" style="margin: 0">Review loop</h1>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="badge">turn 1 of 12</span><span class="badge wa">Coder needs you</span></div>
</div>
<div class="abar">
<button class="btn pri">Open Coder<span class="kbd">⏎</span></button>
<button class="btn">Stop<span class="kbd">⌘.</span></button>
<span style="flex: 1"></span>
<button class="btn ico sm gh" aria-label="More: Edit definition, Copy run id"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r=".8"/><circle cx="8" cy="8" r=".8"/><circle cx="12.5" cy="8" r=".8"/></svg></button>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 12px 0; display: flex; flex-direction: column; gap: 18px">
<div class="props" style="grid-template-columns: 88px minmax(0, 1fr); column-gap: 12px; padding: 0 4px">
<span class="k">Input</span><div class="v ell">Rate-limit notifications per workspace</div>
<span class="k">Started</span><div class="v"><span>13:14</span><span class="mut">31 min ago</span></div>
</div>
<div style="display: flex; flex-direction: column">
<span class="mut cap" style="padding: 0 4px 4px">Nodes</span>
<div class="row foc"><svg class="i s12 mut" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg><svg class="i wa-i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.8M8 11.1v.1"/></svg><span>Coder</span><span class="cap wa-i">waiting for you</span></div>
<div class="row" style="padding-left: 46px"><span class="mut">→ Reviewer</span><span class="cap faint">on done · on error</span></div>
<div class="row"><svg class="i s12 mut" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg><svg class="i mut" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/></svg><span>Reviewer</span><span class="cap mut">idle</span></div>
<div class="row" style="padding-left: 46px"><span class="mut">→ Coder</span><span class="cap faint">on outcome “changes”</span></div>
</div>
</div>
</main>
</div>

<footer class="sb">
<span style="display: flex; align-items: center; gap: 6px"><span class="dot faint"></span>core</span>
<span class="wa-i">1 waiting</span>
<span style="flex: 1"></span>
<span>⏎ open · ⌘K</span>
</footer>
</div>
</div>
</body></html>
