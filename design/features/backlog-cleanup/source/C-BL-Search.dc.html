<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companion: backlog search by number</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/8f71d86e93f170850cbc3ca4af1cb0cf">
<link rel="stylesheet" href="/_blob/4987a8b4234bbea3e512a6d02560ee1d">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}

.comp .ptl{color:var(--ac);font-weight:500;text-decoration:none}
.comp .ptl.dn{color:var(--t3)}
.comp .ptl.pr{background:color-mix(in srgb,var(--ac) 22%,transparent);border-radius:5px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.comp .ub{align-self:flex-end;max-width:300px;padding:9px 13px;border-radius:18px;background:var(--s2);font-size:15px;line-height:20px}
.comp .pr15{font-size:15px;line-height:22px;margin:0}
.comp .pul{margin:0;padding-left:20px;font-size:15px;line-height:22px;display:flex;flex-direction:column;gap:4px}
.comp .tool{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;color:var(--t3)}
.comp .sf{flex:1;height:36px;border-radius:10px;background:var(--s2);display:flex;align-items:center;gap:7px;padding:0 10px;font-size:16px}
.comp .kv{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;font-size:15px}
.comp .kv+.kv{border-top:1px solid var(--bd)}
.comp .kv .k2{flex:1;color:var(--fg)}
.comp .kv .v2{color:var(--t3)}
.comp .scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:8}
.comp .pv{position:absolute;left:20px;right:20px;border-radius:16px;background:var(--s1);z-index:9;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.comp .menu{position:absolute;left:20px;width:250px;border-radius:14px;background:var(--s2);z-index:9;overflow:hidden}
.comp .menu .mi{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;font-size:16px}
.comp .menu .mi+.mi{border-top:1px solid var(--bd)}

.comp .seg{margin:12px 16px 0;height:34px;border-radius:17px;background:var(--s2);display:grid;grid-template-columns:1fr 1fr;padding:2px}
.comp .seg>button{border:0;border-radius:15px;font-size:15px;line-height:20px;color:var(--fg);background:none}
.comp .seg>button[aria-selected="true"]{font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.comp.th-cdark .seg>button[aria-selected="true"]{background:#636366}
.comp.th-clight .seg>button[aria-selected="true"]{background:#FFFFFF}
</style>
</helmet>
<div class="cm comp th-{{theme}}" style="width: 393px; height: 852px">
<div class="top"><button class="gbtn glass" aria-label="Back to Macs"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button><span style="flex: 1"></span><div class="gpill glass"><button aria-label="New task"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div></div>
<div style="position: absolute; inset: 0; padding-top: 112px; overflow: hidden">
<h1 class="big" style="margin: 0; padding: 0 20px">clubmate</h1>
<div class="seg" role="tablist" aria-label="Workspace view"><button role="tab" aria-selected="false">Agents</button><button role="tab" aria-selected="true">Backlog</button></div>
<div style="display: flex; align-items: center; gap: 10px; margin: 12px 16px 0"><label class="sf" for="ph-q"><svg class="i mut" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><span style="flex: 1">40</span><svg class="i mut" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></svg></label><input id="ph-q" aria-label="Search tasks" style="position: absolute; width: 1px; height: 1px; opacity: 0" tabindex="-1"><span class="ac-i" style="font-size: 16px">Cancel</span></div>
<div class="hdr"><span>Task #40</span></div>
<div class="ig" style="box-shadow: inset 0 0 0 1.5px var(--ac)"><div class="c" style="align-items: flex-start"><span class="st n" style="margin-top: 1px"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/></svg></span><div class="cbody"><span>Open items Mac: mouse paths</span><span class="cap mut ell">#40 · Todo · mac, open-items</span></div><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 14px; height: 14px; color: var(--t4)"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></div></div>
<div class="foot mut" style="padding: 6px 20px 0">Return opens #40</div>
<div class="hdr"><span>Text matches</span><span class="cap">2</span></div>
<div class="ig"><div class="c" style="align-items: flex-start"><span class="st n" style="margin-top: 1px"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/></svg></span><div class="cbody"><span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden"><span class="w6" style="color: var(--t3); margin-right: 6px">!!</span>Land gate rollout: release, add the gate for the clubmate repo</span><span class="cap mut ell">#81 · Todo · “See #12 and #40.”</span></div><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 14px; height: 14px; color: var(--t4)"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></div><div class="c" style="align-items: flex-start"><span class="st n" style="margin-top: 1px; color: var(--t3)"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="m5.5 8.2 1.8 1.8 3.4-3.6"/></svg></span><div class="cbody"><span class="t2">roots compare.py on both Macs</span><span class="cap mut ell">#78 · Done · “agree on 40 roots”</span></div><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 14px; height: 14px; color: var(--t4)"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["cdark","clight"],"default":"cdark"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'cdark' };
}
}
</script>
</body>
</html>
