<x-dc>

<div class="cm comp th-{{theme}}" style="width: 393px; height: 852px">

<span style="flex: 1"></span>
</div>
<div style="position: absolute; inset: 0; padding-top: 112px; overflow: hidden">

<div class="cap mut" style="padding: 2px 20px 0"><span class="mdot id-blue" style="margin-right: 6px"></span>online · 2 workspaces</div>

<div class="hdr"><span>Colour</span></div>
<div class="ig" role="radiogroup" aria-label="Colour for Mac Studio">
<div class="c" role="radio" aria-checked="false" style="min-height: 48px; padding: 10px 16px"><span class="mdot id-sky" style="width: 24px; height: 24px"></span><div class="cbody"><span>Sky</span></div></div>
<div class="c" role="radio" aria-checked="true" style="min-height: 48px; padding: 10px 16px"><span class="mdot id-blue" style="width: 24px; height: 24px"></span><div class="cbody"><span>Blue</span></div><svg class="i ac-i" viewBox="0 0 16 16" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.2"><path d="m3.5 8.5 3 3 6-7"/></svg></div>
<div class="c" role="radio" aria-checked="false" style="min-height: 48px; padding: 10px 16px"><span class="mdot id-indigo" style="width: 24px; height: 24px"></span><div class="cbody"><span>Indigo</span></div></div>
<div class="c" role="radio" aria-checked="false" style="min-height: 48px; padding: 10px 16px"><span class="mdot id-purple" style="width: 24px; height: 24px"></span><div class="cbody"><span>Purple</span></div></div>
<div class="c" role="radio" aria-checked="false" style="min-height: 48px; padding: 10px 16px"><span class="mdot id-magenta" style="width: 24px; height: 24px"></span><div class="cbody"><span>Magenta</span></div><span class="val sub">MacBook Pro</span></div>
<div class="c" role="radio" aria-checked="false" style="min-height: 48px; padding: 10px 16px"><span class="mdot id-graphite" style="width: 24px; height: 24px"></span><div class="cbody"><span>Graphite</span></div><span class="val sub">MacBook Air</span></div>
</div>
<p class="cap mut" style="padding: 8px 20px 0">Shown next to this Mac's name on your iPhone and iPad, and in the Mac's title bar. Changing it here changes it on the Mac.</p>

<div class="hdr"><span>This Mac</span></div>
<div class="ig plain">
<div class="c"><div class="cbody"><span>Name</span></div><span class="val">Mac Studio</span></div>
<div class="c"><div class="cbody"><span>Notifications</span></div><span class="val">All requests</span><svg class="i chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg></div>
</div>
<div class="ig" style="margin-top: 22px">
<div class="c"><div class="cbody"><span class="er-i">Forget this Mac</span></div></div>
</div>
</div>
</div>
</x-dc>
