/* Mac identity colours — one per paired Mac; a mark next to the Mac's name, never a role.
   Hues kept away from accent (green), warning (amber), danger (red) and success (teal). */
.th-kanagawa,.th-onedark,.th-mate,.th-cdark{--id-sky:#5AC8FA;--id-blue:#3D8BFF;--id-indigo:#8582FF;--id-purple:#BF7AF0;--id-magenta:#F06FC8;--id-graphite:#A1A1A6}
.th-latte,.th-matelight,.th-clight{--id-sky:#0A78A8;--id-blue:#1F62D0;--id-indigo:#5450D6;--id-purple:#8540BF;--id-magenta:#B02E8C;--id-graphite:#636369}
.id-sky{--id:var(--id-sky)} .id-blue{--id:var(--id-blue)} .id-indigo{--id:var(--id-indigo)}
.id-purple{--id:var(--id-purple)} .id-magenta{--id:var(--id-magenta)} .id-graphite{--id:var(--id-graphite)}
.cm .mdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--id);flex:none;vertical-align:middle}
.cm .mtint{color:var(--id)}

.cm{
  --s1:color-mix(in srgb,var(--fg) 4%,var(--bg));
  --s2:color-mix(in srgb,var(--fg) 7%,var(--bg));
  --s3:color-mix(in srgb,var(--fg) 11%,var(--bg));
  --t2:color-mix(in srgb,var(--fg) var(--t2r),var(--bg));
  --t3:color-mix(in srgb,var(--fg) var(--t3r),var(--bg));
  --t4:color-mix(in srgb,var(--fg) var(--t4r),var(--bg));
  --hov:color-mix(in srgb,var(--fg) 6%,transparent);
  --prs:color-mix(in srgb,var(--fg) 11%,transparent);
  --sel:color-mix(in srgb,var(--ac) 20%,transparent);
  --seli:color-mix(in srgb,var(--fg) 9%,transparent);
  --bd:color-mix(in srgb,var(--fg) 12%,transparent);
  --bd2:color-mix(in srgb,var(--fg) 22%,transparent);
  --ac-bg:color-mix(in srgb,var(--ac) 15%,transparent);
  --ok-bg:color-mix(in srgb,var(--ok) 15%,transparent);
  --wa-bg:color-mix(in srgb,var(--wa) 15%,transparent);
  --er-bg:color-mix(in srgb,var(--er) 15%,transparent);
  --ac-bd:color-mix(in srgb,var(--ac) 45%,transparent);
  --ok-bd:color-mix(in srgb,var(--ok) 45%,transparent);
  --wa-bd:color-mix(in srgb,var(--wa) 50%,transparent);
  --er-bd:color-mix(in srgb,var(--er) 50%,transparent);

  font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  font-size:12px;line-height:20px;font-variant-ligatures:none;
  -webkit-font-smoothing:antialiased;
}
.cm *{box-sizing:border-box}
.cm button,.cm input,.cm select,.cm textarea{font:inherit;color:inherit;margin:0}
.cm button{background:transparent;border:0;padding:0;-webkit-appearance:none;appearance:none}
.doc .cm{min-width:0}

.cm svg.i.s12{width:12px;height:12px}

.cm .cap{font-size:11px;line-height:16px}

.cm .ac-i{color:var(--ac-i)} .cm .ok-i{color:var(--ok-i)} .cm .wa-i{color:var(--wa-i)} .cm .er-i{color:var(--er-i)}

/* rows: list / tree / table */

.cm .sec{display:flex;align-items:center;gap:6px;height:26px;padding:6px 8px 0;color:var(--t3);font-size:11px;line-height:16px;flex:none}

.cm .btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:5px;border:1px solid var(--bd2);background:var(--s2);color:var(--fg);white-space:nowrap;flex:none;cursor:default}

.cm .tog.on{background:var(--ac)}

.cm .card{background:var(--s2);border:1px solid var(--bd);border-radius:8px}

.cm .hr{height:1px;background:var(--bd);flex:none}

/* window chrome */
.cm .win{display:grid;grid-template-rows:38px minmax(0,1fr) 22px;width:100%;height:100%;overflow:hidden}
.cm .tb{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;background:var(--s1);border-bottom:1px solid var(--bd);min-width:0}

.cm .ri{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--t3);position:relative;flex:none}
.cm .ri.on{color:var(--fg);background:var(--hov)}

<div class="eyebrow">Clubmate · Agents · Graphs and Gates move in</div>
<h1>Graphs and land gates inside Agents</h1>
<p class="lead">The rail loses Graphs and Gates. Chosen: A, one tree. Runs stay with their sessions and open their page in place; Service, Land gates and Graphs are docked at the bottom of the sidebar, always in sight; old runs go to Closed with their sessions and outlive them.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px"><h2>Three directions</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px"><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><div style="display: flex; gap: 8px; align-items: baseline"><h3 style="margin: 0; font-size: 16px">A · One tree</h3><span class="tag a">chosen</span></div><p style="margin: 0">Runs stay where they work, in the worktree group with their node sessions. Service, Land gates and Graphs are docked at the bottom of the sidebar, outside the scrolling tree; Closed stays in the tree. A run row, a definition and a gate each open their page in the main pane.</p><p class="muted" style="margin: 0"><b>For:</b> One tree, one Needs-you count, nothing to switch. The dock is always in sight however long the tree is, so a voice session or an untrusted graph that asks is never scrolled away.</p><p class="muted" style="margin: 0"><b>Against:</b> The dock takes three rows from the tree, more while one is open. Definitions sit beside sessions in one sidebar.</p><p class="muted cap" style="margin: 0">AG-A-Run-1280-Mate, AG-A-Gate-1280-Mate, AG-A-Tree-640-MateLight, AG-A-Gate-640-MateLight, C-AG-A-*</p></div><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><div style="display: flex; gap: 8px; align-items: baseline"><h3 style="margin: 0; font-size: 16px">B · Tabs</h3><span class="tag ">no</span></div><p style="margin: 0">A segmented control at the top of the sidebar: Sessions · Graphs · Gates, each with its needs-you count. Sessions is today's tree; Graphs is today's Graphs sidebar; Gates is gated repos plus the landings under review.</p><p class="muted" style="margin: 0"><b>For:</b> Smallest change: the two old sidebars move in whole. Each list stays short.</p><p class="muted" style="margin: 0"><b>Against:</b> Three places to look; a run shows twice (Sessions and Graphs); a tab hides what needs you behind a number; needs a tab-switch key that isn't in docs/shortcuts.md yet.</p><p class="muted cap" style="margin: 0">AG-B-Graphs-1280-Mate, AG-B-Gates-640-MateLight, C-AG-B-Agents-Light</p></div><div style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><div style="display: flex; gap: 8px; align-items: baseline"><h3 style="margin: 0; font-size: 16px">C · Group by</h3><span class="tag ">no</span></div><p style="margin: 0">One tree, regrouped by a Group by control: worktree (default) · graph · land gate. By graph, definitions are parents with their runs; by land gate, the gate is the parent with its landings and review rounds.</p><p class="muted" style="margin: 0"><b>For:</b> Answers “all runs of this graph” and “every landing under this gate” in place; chips still filter.</p><p class="muted" style="margin: 0"><b>Against:</b> Rows move when you switch, so position memory breaks; sessions outside a graph or gate fall into a catch-all; a third grouping control on a 250 pt sidebar.</p><p class="muted cap" style="margin: 0">AG-C-Graph-1280-Mate, AG-C-Gate-640-MateLight, C-AG-C-Agents</p></div></div></div>
<div style="display: flex; flex-direction: column"><h2>A · one tree, in detail (questions 1–4)</h2><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">1 · Where they live</h3><p style="margin: 0"><b>Docked at the bottom of the sidebar</b>, outside the scrolling tree, in this order: <b>Service</b>, <b>Land gates</b>, <b>Graphs</b> (Graphs at the very bottom). They stay in sight however long the tree is and however far it is scrolled; the tree fades out where it meets them, and a short tree leaves empty space above them. Service moves out of the tree into the dock (docs/agents.md § Service sessions changes); <b>Closed stays in the tree</b>, last, as today. Graphs holds “How graphs work” and the definitions; Land gates holds “How land gates work” and one row per gated repo. The UI says <b>land gate</b> everywhere a graph named “Review gate” can also show. No tabs, no extra chips.</p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">2 · Runs and definitions</h3><p style="margin: 0">A run row stays in the worktree group where the run works, with its node sessions under it, as today. <b>↩ or a click opens the run page in the Agents main pane</b> (diagram, Input/Turns/Definition, History, Open ‹node› ⌘↩, Stop run ⌘.), with a crumb Agents / main / Review gate · #4; ⌘[ goes back to the session you came from. Folding moves to ← → and the chevron, the same as every other tree row. A definition row opens the definition page: Description, <b>Input + Run ⌘↩</b>, Turns, the diagram, and <b>Runs of this graph</b> (all of them, newest first). That is where a run starts; ⌘K also offers “Run ‹graph›…”.</p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">3 · Ended and emptied runs</h3><p style="margin: 0">A run follows its sessions. While any node session is open, the run stays in its worktree group; ended runs fold themselves once you have opened them. When the run has ended and none of its sessions is open, the run row moves to <b>Closed</b> with its sessions under it. When its sessions are deleted after 30 days or archived, the row stays, built from the run itself: a faint graph glyph, “no sessions”, and the run page still opens with input, turns, diagram and History (Open ‹node› is gone). It leaves only through Remove run…. Side by side: a run that asks you itself has an amber glyph and the detail “asks you”, counts once in Needs you, and its page carries the request card; a run whose node waits has a plain glyph and the pointer “→ Coder”, and the amber sits on the Coder row only.</p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">4 · Land gates</h3><p style="margin: 0">The gate page (settings, Pause P, Edit E, Delete ⌘⌫, Verdicts, findings) opens from Land gates in the dock; New land gate is + on that row and in ⌘K. <b>Reviewer sessions move under their lander</b>, named “Round 2 review”, with the verdict as detail (“changes”, “approved”, “reviewing”) instead of the notify level. The lander's own detail stays the gate state (review… / asking). The gate row's detail is a pointer, “1 asking”, never a second amber. A changes verdict is history: plain ink, also on the findings card. From the lander, the Land anyway / Stop card links to its rounds on the gate page.</p></div></div>
<div style="display: flex; flex-direction: column"><h2>The dock (16 Nov)</h2><p class="muted" style="margin: 0 0 4px">The user's change to A: Graphs, Land gates and Service pinned at the bottom of the sidebar, outside the scrolling tree. Boards: AG-A-Run-1280-Mate (all folded; Service asks), AG-A-Gate-1280-Mate (Land gates open; Graphs has one to trust), AG-A-Tree-640-MateLight (Graphs open in the drawer).</p><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">Unfolding</h3><p style="margin: 0">A docked row unfolds <b>upward, inside the sidebar</b>: the dock grows over the tree, which keeps its own scroll above it. One docked row opens at a time; opening another folds the first. An open row shows at most <b>6 rows, then scrolls inside</b> (“up to 6 rows, then it scrolls”), so the tree never loses more than about a third of the sidebar. Its rows open their page in the main pane like any tree row. <span class="muted">Rejected: a list page in the main pane — two steps to reach a definition, and it replaces the run or session you were reading. A popover — gone the moment you click into a page, so it can't stay open beside the work.</span></p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">Needs you</h3><p style="margin: 0">Amber goes where the answer is. <b>Service</b>: when the voice session asks, the docked row turns amber, “asks you”, and counts once in Needs you; unfolding shows the Voice row in amber. <b>Graphs</b>: when an untrusted graph waits to run (a trigger, a cron job or a run asked for it), the row reads “1 to trust” in amber and counts once; the definition row reads “trust?”, and Trust… is on its page. <b>Land gates</b>: “1 asking” in plain ink — a pointer, because the answer is the Land anyway / Stop card on the lander in the tree, which already counts. Nothing else on a docked row is amber.</p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">Keyboard</h3><p style="margin: 0">Tree and dock are one list for <b>j/k</b>: j past the last visible tree row steps onto the first docked row (Service), k from Service steps back to the last tree row; the tree keeps its scroll. On a docked row, → or ↩ unfolds it upward and ← or Esc folds it; inside, j/k walk its rows and ↩ opens the page. / filters the tree and the dock together, and a match in a folded docked row unfolds it. ⌘K “Open land gates” and “Run ‹graph›…” land in the dock. No new keys.</p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">640 drawer</h3><p style="margin: 0">The ⌘B drawer is the same sidebar: the tree scrolls, the dock sits at the drawer's bottom, and an open docked row grows upward inside the drawer with the same 6-row cap (AG-A-Tree-640-MateLight).</p></div><div style="display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 14px 0; border-bottom: 1px solid #DAD8CF"><h3 style="font-size: 16px; margin: 0">Phone</h3><p style="margin: 0">The phone does not dock them. Closed, Service, Land gates and Graphs end the Agents list, as in C-AG-A-Agents: the bottom of the phone screen already belongs to search and voice, and a docked strip there would sit under the thumb next to them. What made the dock worth it on the Mac — something that asks while scrolled away — is covered differently: anything that asks inside them is listed at the top, in Needs you (Voice in C-AG-A-Agents), and the row at the end reads “1 asks” in plain ink.</p></div></div>
<div style="display: flex; flex-direction: column; gap: 12px"><h2>Run rows — states the plugin owns</h2><p class="muted" style="margin: 0">The plugin sends the state, the detail word and where the row lives; Mac and phone only draw them.</p><table><tr><td class="muted"><b>Run state (plugin field)</b></td><td class="muted"><b>Glyph</b></td><td class="muted"><b>Detail</b></td><td class="muted"><b>Ink</b></td><td class="muted"><b>Needs you</b></td><td class="muted"><b>Lives in</b></td></tr><tr><td style="width: 220px">running</td><td style="width: 110px">graph</td><td style="width: 230px">turn 3 · or the node working</td><td style="width: 80px">accent</td><td style="width: 170px">no</td><td>its worktree group</td></tr><tr><td style="width: 220px">running · a node waits</td><td style="width: 110px">graph</td><td style="width: 230px">→ Coder</td><td style="width: 80px">plain</td><td style="width: 170px">the node counts, not the run</td><td>its worktree group, never folds</td></tr><tr><td style="width: 220px">asks (step approval, round cap)</td><td style="width: 110px">graph, amber</td><td style="width: 230px">asks you</td><td style="width: 80px">amber</td><td style="width: 170px">yes, once</td><td>its worktree group, never folds</td></tr><tr><td style="width: 220px">ended</td><td style="width: 110px">graph, ok</td><td style="width: 230px">done · or the end edge (“approved”)</td><td style="width: 80px">ok</td><td style="width: 170px">no</td><td>its group; folds once opened; Closed when no session is open</td></tr><tr><td style="width: 220px">stopped / failed</td><td style="width: 110px">graph</td><td style="width: 230px">stopped · failed</td><td style="width: 80px">plain · red</td><td style="width: 170px">no</td><td>same as ended</td></tr><tr><td style="width: 220px">emptied (no sessions left)</td><td style="width: 110px">graph, faint</td><td style="width: 230px">no sessions</td><td style="width: 80px">faint</td><td style="width: 170px">no</td><td>Closed, until Remove run…</td></tr></table></div>
<div style="display: flex; flex-direction: column; gap: 12px"><h2>5 · Keys</h2><p class="muted" style="margin: 0">Keyboard first: the selection decides. One meaning per key; where a key had two meanings in two sections, the selected row or the open page picks.</p><table><tr><td class="muted"><b>Key</b></td><td class="muted"><b>Tree row selected</b></td><td class="muted"><b>Run page</b></td><td class="muted"><b>Definition page</b></td><td class="muted"><b>Gate page</b></td></tr><tr><td style="width: 130px">↩</td><td style="width: 300px">open its page (session, run, definition, gate); on a docked row, unfold or fold it</td><td style="width: 260px">—</td><td style="width: 160px">—</td><td>open the selected landing</td></tr><tr><td style="width: 130px">← →</td><td style="width: 300px">fold / unfold; a docked row unfolds upward, ← or Esc folds it</td><td style="width: 260px">—</td><td style="width: 160px">—</td><td>—</td></tr><tr><td style="width: 130px">Tab</td><td style="width: 300px">into the page</td><td style="width: 260px">next edge (diagram keys)</td><td style="width: 160px">next edge</td><td>next row</td></tr><tr><td style="width: 130px">Esc</td><td style="width: 300px">—</td><td style="width: 260px">back to the tree</td><td style="width: 160px">back to the tree</td><td>back to the tree</td></tr><tr><td style="width: 130px">⌘N</td><td style="width: 300px">new session (unchanged)</td><td style="width: 260px">new session</td><td style="width: 160px">new session</td><td>new session</td></tr><tr><td style="width: 130px">⌘↩</td><td style="width: 300px">—</td><td style="width: 260px">Open ‹the node that waits, else the last›</td><td style="width: 160px">Run with Input</td><td>—</td></tr><tr><td style="width: 130px">⌘.</td><td style="width: 300px">Stop run (run row)</td><td style="width: 260px">Stop run</td><td style="width: 160px">—</td><td>—</td></tr><tr><td style="width: 130px">⌘⌫</td><td style="width: 300px">Remove… the selected thing: session as today, run only when ended</td><td style="width: 260px">Remove run… (ended)</td><td style="width: 160px">— (definitions are files)</td><td>Delete land gate…</td></tr><tr><td style="width: 130px">P · E</td><td style="width: 300px">—</td><td style="width: 260px">—</td><td style="width: 160px">—</td><td>Pause · Edit (as in Gates today)</td></tr><tr><td style="width: 130px">⌥1–⌥3</td><td style="width: 300px">—</td><td style="width: 260px">answer the step card: Allow once · Always… · Reject</td><td style="width: 160px">—</td><td>—</td></tr><tr><td style="width: 130px">j/k</td><td style="width: 300px">move rows; j past the last tree row steps into the dock, k from Service steps back</td><td style="width: 260px">—</td><td style="width: 160px">—</td><td>j/k verdict rows</td></tr><tr><td style="width: 130px">Tab · h · o · − + 0</td><td style="width: 300px">—</td><td style="width: 260px">diagram keys, once the page has focus</td><td style="width: 160px">diagram keys</td><td>—</td></tr></table><h3 style="font-size: 16px; margin: 8px 0 0">Rail</h3><table><tr><td class="muted"><b></b></td><td class="muted"><b>Before</b></td><td class="muted"><b>After</b></td></tr><tr><td style="width: 120px">⌘1–⌘7</td><td style="width: 420px">Code, Terminals, Agents, Backlog, Processes, Cron, Triggers</td><td>unchanged</td></tr><tr><td style="width: 120px">⌘8</td><td style="width: 420px">Graphs</td><td>free — the next rail item takes it (a second editor)</td></tr><tr><td style="width: 120px">⌘9</td><td style="width: 420px">Gates (only with nine or fewer items)</td><td>free</td></tr><tr><td style="width: 120px">⌘K</td><td style="width: 420px">—</td><td>adds: Run ‹graph›… · New graph… · New land gate… · Open land gates</td></tr></table></div>
<div style="display: flex; flex-direction: column; gap: 12px"><h2>6 · Links</h2><table><tr><td class="muted"><b>Today opens Graphs</b></td><td class="muted"><b>Now opens</b></td></tr><tr><td style="width: 460px">Bell: pinned run item · the run's macOS notification</td><td>Agents › the run's row, run page open, the request card in view</td></tr><tr><td style="width: 460px">Triggers: Open graph (G) on a graph edge</td><td>Agents › the run page when the edge belongs to a run, else the definition page; the edge selected</td></tr><tr><td style="width: 460px">Code chat: “Open in Graphs” for a graph step</td><td>renamed “Open run” → Agents › run page, that step selected</td></tr><tr><td style="width: 460px">Phone: run row</td><td>the native run screen (unchanged)</td></tr><tr><td style="width: 460px">Gate verdicts: Open review · Open landing</td><td>the reviewer session (now under its lander) · the lander session</td></tr></table></div>
<div style="display: flex; flex-direction: column; gap: 12px"><h2>7 · Phone</h2>
<p style="margin: 0">Run rows show in the Agents list at all times, like the Mac: a run with its node sessions nested under it, in Needs you or Running by the run's own state (C-AG-A-Agents). <b>Closed, Service, Land gates and Graphs</b> end the list as ordinary rows, not docked (see “The dock · Phone” above); anything that asks inside them is listed at the top, in Needs you. Graphs lists the definitions and the ended runs (C-AG-A-Graphs-Light); a definition opens with Input and Run; new graphs are written on the Mac. A run opens the native run screen, also when its sessions are gone (C-AG-A-Run). Land gates opens the gate screen as SDUI: the landing that asks first, settings, verdicts, Pause; Edit and New land gate stay on the Mac, because the phone draws no sheet (C-AG-A-Gate-Light). A phone that hasn't been updated loses More → Graphs and More → Gates: its More lists exactly the sections the Mac rail shows, so keeping them would keep the two rail items on the Mac. Its native run screen keeps working through command aliases, and the lander's Land anyway / Stop card still shows; definitions, ended runs and land gates are out of reach on that phone until it is updated.</p></div>
<div style="display: flex; flex-direction: column; gap: 12px"><h2>Handoff</h2><table><tr><td style="width: 40px"><span class="tag a">a</span></td><td>Run row ↩ opens a page; ← → fold; Tab into the page and back. Emptied run row (faint graph glyph). Reviewer row under its lander. The dock under the tree: Service, Land gates, Graphs; chevron up when folded; one open at a time, growing upward, 6 rows then it scrolls; the tree fades where it meets the dock. Phone: run rows grouped with their node sessions; Closed · Service · Land gates · Graphs end the list, not docked.</td></tr><tr><td style="width: 40px"><span class="tag a">a</span></td><td>Rail drops two items; ⌘8 and ⌘9 freed. docs/shortcuts.md: ↩ on a run row, ⌘⌫ by selection, ⌘K commands.</td></tr><tr><td style="width: 40px"><span class="tag b">b</span></td><td><code>tree</code> row prop <code>open</code>: the view the main pane shows for this row (session, run, definition, gate) — today only sessions open.</td></tr><tr><td style="width: 40px"><span class="tag b">b</span></td><td><code>tree</code> prop <code>dock</code>: sections pinned under the scrolling rows, each {id, label, icon, detail, attention, rows, add, cap}; <code>add</code> is the + action (New land gate…, New graph…); the phone renders the same sections as ordinary rows at the end of the list.</td></tr><tr><td style="width: 40px"><span class="tag c">c</span></td><td>Words: “Land gates”, “How land gates work”, “Round 2 review”, “asks you”, “→ Coder”, “no sessions”, “Runs of this graph”, “Open run”; land gate everywhere “gate” could mean the Review gate graph.</td></tr><tr><td style="width: 40px"><span class="tag c">c</span></td><td>Order: the tree is worktree groups, then Closed. The dock is Service, Land gates, Graphs, with Graphs at the very bottom. Ended runs fold once opened. docs/agents.md § Service sessions: Service leaves the tree for the dock.</td></tr><tr><td style="width: 40px"><span class="tag p0">d</span></td><td>Docked sections carry <code>attention</code>, decided in the plugin: Service = asks when a service session needs you (amber, counts in Needs you); Graphs = asks when an untrusted graph waits to run (amber “1 to trust”, counts); Land gates = pointer (“1 asking”, plain), since the answer is on the lander.</td></tr><tr><td style="width: 40px"><span class="tag p0">d</span></td><td><code>agents.runs</code>: id, graph, title, worktree, state (running · asks · ended · stopped · failed · emptied), detail, needsYou, request, pointer (node id), sessions[], home (group · closed). Built from the run, so it survives its sessions.</td></tr><tr><td style="width: 40px"><span class="tag p0">d</span></td><td>Reviewer: <code>parentId</code> = lander; <code>gate</code> = {round, of, verdict, findings} replaces the notify detail. Gate rows: {repo, active, asking count}.</td></tr><tr><td style="width: 40px"><span class="tag p0">d</span></td><td>Link targets: bell, notification, Triggers G, Code chat → <code>agents/run/‹id›</code>, <code>agents/graph/‹name›</code>, <code>agents/gate/‹repo›</code>.</td></tr><tr><td style="width: 40px"><span class="tag p0">d</span></td><td>Old phones: nothing to keep. Their More lists exactly the Mac rail's sections (the same rail filter), so with the two rail items gone they lose More → Graphs and More → Gates. Keep the command aliases the native run screen uses, and keep sending the lander's Land anyway / Stop request.</td></tr></table></div>
